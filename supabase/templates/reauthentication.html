<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Código de confirmação</title></head>
<body style="margin:0;padding:0;background:#F5F7FC;font-family:Arial,Helvetica,sans-serif;color:#0A1A3F">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F5F7FC;padding:32px 12px"><tr><td align="center">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border-radius:16px;overflow:hidden;border:1px solid #DCE3F2">
    <tr><td style="background:#0A1A3F;padding:24px 32px;color:#ffffff;font-size:22px;font-weight:bold">Portfy</td></tr>
    <tr><td style="padding:32px">
      <h1 style="margin:0 0 12px;font-size:24px;line-height:1.2;color:#0A1A3F">Código de confirmação</h1>
      <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#33415f">Use o código abaixo para confirmar a alteração na sua conta.</p>
      <div style="display:inline-block;background:#F5F7FC;border:1px solid #DCE3F2;border-radius:10px;padding:14px 28px;font-size:30px;letter-spacing:6px;font-weight:bold;color:#0A1A3F">{{ .Token }}</div>
      <p style="margin:24px 0 0;font-size:13px;line-height:1.6;color:#6b7893">Nunca compartilhe este código com ninguém.</p>
    </td></tr>
    <tr><td style="padding:20px 32px;background:#F5F7FC;font-size:12px;color:#6b7893">Você recebeu este e-mail porque alguém usou o endereço {{ .Email }} no Portfy. Se não foi você, ignore esta mensagem.<br><a href="{{ .SiteURL }}" style="color:#1F44C9">{{ .SiteURL }}</a></td></tr>
  </table>
</td></tr></table></body></html>
